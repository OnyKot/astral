server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: vercord_backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: vercord_backend
          app: vercord_api
          __path__: /var/log/vercord/*.log
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            event: event
            method: method
            path: path
            status: status
            durationMs: durationMs
            userId: userId
            error: error
      - timestamp:
          source: ts
          format: RFC3339
          action_on_failure: skip
      - labels:
          level:
          event:
          method:
          status:

