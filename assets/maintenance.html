<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#0d1117" />
		<title>Astral — технические работы</title>
		<style>
			/*
			 * Everything is inline on purpose: this page is served while the app is down, so it must
			 * not depend on the bundle, the CDN or any font host. Colours are the web app's default
			 * dark theme (src/global.css) so the interruption still looks like Astral.
			 */
			:root {
				--bg-deep: #0d1117;
				--bg: #151a21;
				--panel: #1b2330;
				--border: rgba(240, 246, 252, 0.08);
				--text: #f0f6fc;
				--muted: #8b949e;
				--brand: #8b5cf6;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg) 100%);
				color: var(--text);
				font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			.card {
				width: 100%;
				max-width: 460px;
				padding: 40px 32px;
				text-align: center;
				background: color-mix(in srgb, var(--panel) 82%, transparent);
				border: 1px solid var(--border);
				border-radius: 24px;
				box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
			}
			.orbit {
				width: 84px;
				height: 84px;
				margin: 0 auto 24px;
				position: relative;
			}
			.orbit__core {
				position: absolute;
				inset: 50% auto auto 50%;
				width: 18px;
				height: 18px;
				margin: -9px 0 0 -9px;
				border-radius: 50%;
				background: var(--brand);
				box-shadow: 0 0 24px color-mix(in srgb, var(--brand) 70%, transparent);
			}
			.orbit__ring {
				position: absolute;
				inset: 0;
				border: 2px solid transparent;
				border-top-color: var(--brand);
				border-radius: 50%;
				animation: spin 1.6s linear infinite;
			}
			.orbit__ring--slow {
				inset: 14px;
				border-top-color: transparent;
				border-bottom-color: color-mix(in srgb, var(--brand) 55%, transparent);
				animation-duration: 2.6s;
				animation-direction: reverse;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			h1 {
				margin: 0 0 12px;
				font-size: 24px;
				font-weight: 800;
				letter-spacing: -0.02em;
			}
			p {
				margin: 0;
				color: var(--muted);
				font-size: 15px;
				line-height: 22px;
			}
			.status {
				margin-top: 24px;
				padding-top: 20px;
				border-top: 1px solid var(--border);
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				color: var(--muted);
				font-size: 13px;
			}
			.dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--brand);
				animation: pulse 1.4s ease-in-out infinite;
			}
			@keyframes pulse {
				0%,
				100% {
					opacity: 0.35;
				}
				50% {
					opacity: 1;
				}
			}
			/* Respect the OS setting — the spinner is decorative, not information. */
			@media (prefers-reduced-motion: reduce) {
				.orbit__ring,
				.dot {
					animation-duration: 0.01ms;
					animation-iteration-count: 1;
				}
			}
		</style>
	</head>
	<body>
		<main class="card">
			<div class="orbit" aria-hidden="true">
				<div class="orbit__ring"></div>
				<div class="orbit__ring orbit__ring--slow"></div>
				<div class="orbit__core"></div>
			</div>
			<h1>Скоро вернёмся</h1>
			<p>Обновляем Astral. Это займёт несколько минут — сообщения и данные в безопасности.</p>
			<div class="status">
				<span class="dot" aria-hidden="true"></span>
				<span id="status">Проверяем доступность…</span>
			</div>
		</main>

		<script>
			(function () {
				var statusEl = document.getElementById('status');
				var attempts = 0;

				// Poll a cheap endpoint; as soon as the app answers, reload straight into it.
				// Backs off from 5s to 30s so a long maintenance window does not hammer the box.
				function check() {
					attempts++;
					var delay = Math.min(5000 + attempts * 2000, 30000);

					fetch('/api/instance', {cache: 'no-store', method: 'GET'})
						.then(function (response) {
							if (response.ok) {
								statusEl.textContent = 'Готово, открываем…';
								setTimeout(function () {
									location.reload();
								}, 800);
								return;
							}
							schedule(delay);
						})
						.catch(function () {
							schedule(delay);
						});
				}

				function schedule(delay) {
					statusEl.textContent = 'Ещё немного…';
					setTimeout(check, delay);
				}

				check();
			})();
		</script>
	</body>
</html>
